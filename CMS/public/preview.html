<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Building preview · Store CMS</title>
<style>
  body { margin: 0; min-height: 100vh; display: grid; place-items: center; background: #09090b; color: #e4e4e7; font: 15px/1.5 Inter, ui-sans-serif, system-ui, sans-serif; }
  main { width: min(720px, calc(100vw - 48px)); }
  .eyebrow { font: 11px/1 'JetBrains Mono', ui-monospace, monospace; letter-spacing: .15em; text-transform: uppercase; color: #22d3ee; }
  h1 { font-size: 24px; margin: 8px 0 4px; }
  p { color: #a1a1aa; margin: 0 0 16px; }
  pre { display: none; background: #18181b; border: 1px solid #3f3f46; border-radius: 8px; padding: 12px; max-height: 50vh; overflow: auto; white-space: pre-wrap; font: 12px/1.5 'JetBrains Mono', ui-monospace, monospace; color: #fca5a5; }
  button { display: none; font: inherit; font-weight: 700; padding: 8px 14px; border-radius: 8px; border: 0; background: #fff; color: #000; cursor: pointer; }
  button:hover { background: #22d3ee; }
  .spin { display: inline-block; width: 12px; height: 12px; margin-right: 8px; border: 2px solid #3f3f46; border-top-color: #22d3ee; border-radius: 50%; animation: spin .8s linear infinite; vertical-align: -1px; }
  @keyframes spin { to { transform: rotate(360deg); } }
</style>
</head>
<body>
<main>
  <div class="eyebrow">Site preview</div>
  <h1 id="title"><span class="spin"></span>Building the site</h1>
  <p id="text">Drafts are included, exactly as the site would look if everything were published. This page opens the preview when the build finishes.</p>
  <pre id="log"></pre>
  <button type="button" id="retry">Build again</button>
</main>
<script src="js/preview-wait.js"></script>
</body>
</html>
